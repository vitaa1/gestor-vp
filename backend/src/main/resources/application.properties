spring.application.name=gestor-vp-api

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gestor_vp}
spring.datasource.username=${DB_USERNAME:gestor_vp}
spring.datasource.password=${DB_PASSWORD:gestor_vp_local}
spring.datasource.hikari.minimum-idle=${DB_POOL_MINIMUM_IDLE:0}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT:60000}
spring.datasource.hikari.data-source-properties.prepareThreshold=${DB_PREPARE_THRESHOLD:0}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.mvc.problemdetails.enabled=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-migration-naming=true

app.security.username=${APP_USERNAME}
app.security.password=${APP_PASSWORD}
app.security.rate-limit.max-failures=${AUTH_RATE_LIMIT_MAX_FAILURES:5}
app.security.rate-limit.max-failures-per-ip=${AUTH_RATE_LIMIT_MAX_FAILURES_PER_IP:20}
app.security.rate-limit.window=${AUTH_RATE_LIMIT_WINDOW:15m}
app.security.rate-limit.max-keys=${AUTH_RATE_LIMIT_MAX_KEYS:10000}
app.security.rate-limit.trusted-proxy-header=${TRUSTED_PROXY_HEADER:}

app.inventory.default-time-zone=${APP_DEFAULT_TIME_ZONE:America/Sao_Paulo}

app.demo.enabled=${DEMO_MODE:false}
app.demo.instance-id=${DEMO_INSTANCE_ID:}
app.demo.reset-after=${DEMO_RESET_AFTER:24h}

server.port=${PORT:${SERVER_PORT:8080}}
server.shutdown=graceful

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true

info.app.name=gestorVP API
info.app.description=API para controle simples de validade de produtos
info.app.version=@project.version@
info.app.commit=${RAILWAY_GIT_COMMIT_SHA:local}
