name: vence-facil

services:
  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vence_facil}
      POSTGRES_USER: ${POSTGRES_USER:-vence_facil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vence_facil_local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  application:
    profiles: [application]
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:-vence_facil}
      DB_USERNAME: ${POSTGRES_USER:-vence_facil}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-vence_facil_local}
      SPRING_FLYWAY_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:-vence_facil}
      SPRING_FLYWAY_USER: ${POSTGRES_USER:-vence_facil}
      SPRING_FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:-vence_facil_local}
      APP_USERNAME: ${APP_USERNAME:-operador}
      APP_PASSWORD: ${APP_PASSWORD:-troque-esta-senha-local}
      DEMO_MODE: "false"
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://localhost:8080/actuator/health || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres-data:
