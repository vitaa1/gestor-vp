services:
  - type: web
    name: vence-facil
    runtime: docker
    plan: free
    branch: main
    dockerContext: .
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: checksPass
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: SPRING_FLYWAY_URL
        sync: false
      - key: SPRING_FLYWAY_USER
        sync: false
      - key: SPRING_FLYWAY_PASSWORD
        sync: false
      - key: APP_USERNAME
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_INSTANCE_ID
        sync: false
      - key: DEMO_RESET_AFTER
        value: 24h
      - key: TRUSTED_PROXY_HEADER
        value: CF-Connecting-IP
      - key: AUTH_RATE_LIMIT_MAX_FAILURES
        value: "5"
      - key: AUTH_RATE_LIMIT_MAX_FAILURES_PER_IP
        value: "20"
      - key: AUTH_RATE_LIMIT_WINDOW
        value: 15m
      - key: AUTH_RATE_LIMIT_MAX_KEYS
        value: "10000"
